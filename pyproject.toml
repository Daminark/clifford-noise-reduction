[project]
name = "clifford-noise-reduction"
version = "0.1.0"
description = "Clifford Noise Reduction (CliNR) in Stim"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "stim>=1.16.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "matplotlib>=3.11.0",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "NPY", "RUF"]
# __all__ mirrors each module's definition order, which is itself ordered
# by dependency; alphabetising it would lose that.
ignore = ["RUF022"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
